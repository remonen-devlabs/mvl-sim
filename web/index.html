<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVL Sim</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #15171a; --panel: #1e2125; --line: #30343a; --text: #e4e6e9; --muted: #9aa0a8;
    --accent: #3d8bfd; --err: #ff5a5a; --ok: #3ccf6e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header h1 span { font-size: 11px; font-weight: normal; color: var(--muted); }
  header a.help { color: var(--muted); font-size: 12px; margin-right: 8px; }
  select, input, button { background: #262a2f; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=number] { width: 72px; }
  #fitPath { width: 300px; }
  main { display: grid; grid-template-columns: var(--screenW, 300px) 5px minmax(0, 1fr) 5px var(--asideW, 320px); min-height: 0; }
  .split { cursor: col-resize; background: var(--line); touch-action: none; }
  .split:hover, .split.drag { background: var(--accent); }
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging iframe, body.dragging #map { pointer-events: none; }
  #screenWrap { padding: 10px; display: flex; align-items: flex-start; justify-content: center; min-height: 0; min-width: 0;
    overflow: hidden; }
  #screen { background: #000; border: 6px solid #2a2d31;
    border-radius: 10px; image-rendering: auto; }
  #screen.pixel { image-rendering: pixelated; }
  #screen.actual { width: auto !important; height: auto !important; }
  #screen.round { border-radius: 50%; }
  #screenWrap.actual { overflow: auto; }
  #screen { cursor: zoom-in; }
  #screen.actual { cursor: zoom-out; }
  #map { min-height: 0; }
  aside { overflow: auto; padding: 8px 10px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 12px 0 4px; }
  aside h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 4px; vertical-align: top; }
  td:first-child { color: var(--muted); white-space: nowrap; width: 40%; }
  td.num { font-variant-numeric: tabular-nums; }
  #log { font: 11px/1.35 Consolas, monospace; white-space: pre-wrap; max-height: 180px; overflow: auto;
    background: #111316; padding: 4px 6px; border-radius: 4px; }
  #error { display: none; background: #3a1414; border: 1px solid var(--err); color: #ffd0d0;
    padding: 6px 8px; border-radius: 4px; font: 12px Consolas, monospace; white-space: pre-wrap; }
  #warnings { display: none; background: #3a3214; border: 1px solid #c9a227; color: #ffe9a8;
    padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 6px; }
  #warnings div + div { margin-top: 4px; }
  #check { font: 11px/1.35 Consolas, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 3px 0; }
  .fieldrow { padding: 3px 0; border-bottom: 1px solid var(--line); }
  .fieldrow select.pick { max-width: 190px; }
  .appdetails { margin: 2px 0 2px 14px; font-size: 12px; }
  .appdetails details summary { cursor: pointer; color: var(--muted); margin: 2px 0; }
  #setup { max-width: 220px; }
  #device { max-width: 240px; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 6px 12px 10px; }
  #transport { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #clock { font-variant-numeric: tabular-nums; min-width: 260px; }
  #timeline { width: 100%; height: 110px; display: block; cursor: crosshair; border-radius: 4px; background: #111316; }
  .muted { color: var(--muted); }
  #drop { position: fixed; inset: 0; background: rgba(61,139,253,.15); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; font-size: 22px; z-index: 9999; }
  .leaflet-container { background: #222; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 10px; font-size: 15px; }
  dialog label { display: block; margin: 8px 0 2px; color: var(--muted); }
  dialog input, dialog select { width: 100%; }
  dialog .target { font: 11px Consolas, monospace; color: var(--muted); margin-top: 8px; word-break: break-all; }
  dialog .msg { color: var(--err); margin-top: 6px; }
  .fdplaces { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .fdplaces button { padding: 2px 8px; }
  .fdpath { display: flex; gap: 4px; }
  .fdpath input { flex: 1; }
  .fdlist { height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; margin-top: 6px; background: #111316; }
  .fditem { padding: 3px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fditem:hover { background: #262a2f; }
  .fditem .tag { font-size: 11px; color: var(--ok); margin-left: 6px; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>MVL Sim <span id="version"></span></h1>
  <a class="help" href="/readme" target="_blank" rel="noopener" title="Open the README: how to start, use and what MVL Sim does not do">Help</a>
  <label title="A setup is a device, one data screen layout and what each field shows">Setup <select id="setup"></select></label>
  <button id="saveSetup" title="Save the setup to its file">Save</button>
  <button id="saveAs" title="Save the setup under a new name">Save as…</button>
  <button id="newSetup" title="Start a new setup">New</button>
  <label>Screen <select id="layout"></select></label>
  <label>Device <select id="device"></select></label>
  <button id="reload" title="Re-read every app of the setup (sources, resources) and restart them">Reload apps</button>
  <button id="checkBtn" title="Run monkeyc -l 3 for every Connect IQ field of the setup (output to the temp folder)">Compile check</button>
  <button id="addRoot" title="Browse for a Connect IQ project folder (with manifest.xml) or a folder with projects below it">Add folder…</button>
  <span style="flex:1"></span>
  <input id="fitPath" placeholder="Path to a .fit file">
  <button id="loadPath">Load</button>
  <label class="primary" style="cursor:pointer"><button class="primary" id="openBtn">Open FIT…</button>
    <input id="fitFile" type="file" accept=".fit" hidden></label>
</header>
<main>
  <div id="screenWrap"><canvas id="screen" width="480" height="800" title="Click: actual pixels (1:1) / fit to window"></canvas></div>
  <div class="split" data-col="screenW" title="Drag to resize; double-click to reset"></div>
  <div id="map"></div>
  <div class="split" data-col="asideW" title="Drag to resize; double-click to reset"></div>
  <aside>
    <div id="error"></div>
    <div id="warnings"></div>
    <h2>Ride data now</h2>
    <table id="inputs"></table>
    <h2>Fields</h2>
    <div class="settings" id="fields"></div>
    <h2>Setup settings</h2>
    <div class="settings" id="settings"></div>
    <h2>FIT fields written</h2>
    <table id="fitFields"><tr><td class="muted">none</td></tr></table>
    <h2>App log (println)</h2>
    <div id="log"></div>
    <h2>Compile check</h2>
    <div id="check" class="muted">not run</div>
  </aside>
</main>
<footer>
  <div id="transport">
    <button id="play" class="primary" style="width:70px">Play</button>
    <button id="back60" title="-60 s (Shift+←)">−60s</button>
    <button id="back1" title="-1 s (←)">−1s</button>
    <button id="fwd1" title="+1 s (→)">+1s</button>
    <button id="fwd60" title="+60 s (Shift+→)">+60s</button>
    <label>Speed <select id="speed">
      <option>1</option><option>2</option><option>5</option><option selected>10</option><option>30</option>
      <option>60</option><option>120</option><option>300</option></select>×</label>
    <span id="clock" class="muted"></span>
    <span id="status" class="muted"></span>
  </div>
  <canvas id="timeline"></canvas>
</footer>
<dialog id="saveDlg"><form method="dialog">
  <h3>Save setup as</h3>
  <label for="saveName">Name</label>
  <input id="saveName" autocomplete="off">
  <label for="saveFolder">Folder</label>
  <select id="saveFolder"></select>
  <div class="target" id="saveTarget"></div>
  <div class="msg" id="saveMsg"></div>
  <div class="buttons"><button value="cancel" formnovalidate>Cancel</button><button id="saveOk" class="primary" value="ok">Save</button></div>
</form></dialog>
<dialog id="folderDlg"><form method="dialog">
  <h3 id="fdTitle"></h3>
  <div class="fdplaces" id="fdPlaces"></div>
  <div class="fdpath"><button type="button" id="fdUp" title="Up one folder">↑</button><input id="fdPath" autocomplete="off" title="Type or paste a path and press Enter"></div>
  <div class="fdlist" id="fdList"></div>
  <div class="target" id="fdInfo"></div>
  <div class="muted" id="fdHint" style="margin-top:6px"></div>
  <div class="msg" id="fdMsg"></div>
  <div class="buttons"><button id="fdCancel" type="button">Cancel</button><button id="fdOk" class="primary">Choose this folder</button></div>
</form></dialog>
<div id="drop">Drop the .fit file</div>
<script type="module" src="app.js"></script>
</body>
</html>
